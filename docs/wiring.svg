<svg xmlns="http://www.w3.org/2000/svg" width="660" height="295" viewBox="0 0 660 295">

  <!-- background -->
  <rect width="660" height="295" fill="#ffffff" rx="6"/>

  <!-- ══════════════ ESP32 board ══════════════ -->
  <rect x="20" y="20" width="148" height="258" rx="6" fill="#1a237e" stroke="#3949ab" stroke-width="2"/>
  <text x="94" y="43" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">ESP32</text>

  <!-- Pin labels (right-aligned inside board) -->
  <text x="158" y="65"  text-anchor="end" font-family="monospace" font-size="11" fill="#ef9a9a">3.3V</text>
  <text x="158" y="105" text-anchor="end" font-family="monospace" font-size="11" fill="#ffccbc">GPIO21</text>
  <text x="158" y="145" text-anchor="end" font-family="monospace" font-size="11" fill="#dcedc8">GPIO22</text>
  <text x="158" y="185" text-anchor="end" font-family="monospace" font-size="11" fill="#bbdefb">GPIO23</text>
  <text x="158" y="230" text-anchor="end" font-family="monospace" font-size="11" fill="#e3f2fd">GPIO0</text>
  <text x="158" y="258" text-anchor="end" font-family="monospace" font-size="11" fill="#bdbdbd">GND</text>

  <!-- Pin stubs right side -->
  <line x1="168" y1="61"  x2="188" y2="61"  stroke="#ef5350" stroke-width="2.5"/>
  <line x1="168" y1="101" x2="188" y2="101" stroke="#ff8a65" stroke-width="2"/>
  <line x1="168" y1="141" x2="188" y2="141" stroke="#aed581" stroke-width="2"/>
  <line x1="168" y1="181" x2="188" y2="181" stroke="#64b5f6" stroke-width="2"/>
  <line x1="168" y1="226" x2="188" y2="226" stroke="#90caf9" stroke-width="2"/>
  <line x1="168" y1="254" x2="188" y2="254" stroke="#757575" stroke-width="2.5"/>

  <!-- ══════════════ 3.3V power rail ══════════════ -->
  <line x1="188" y1="61" x2="535" y2="61" stroke="#ef5350" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="362" y="57" text-anchor="middle" font-family="monospace" font-size="9" fill="#ef5350">3.3V rail</text>
  <!-- drop to LED anode -->
  <line x1="535" y1="61" x2="535" y2="88" stroke="#ef5350" stroke-width="2"/>

  <!-- ══════════════ Resistors + wires ══════════════ -->

  <!-- Red  GPIO21 → 220Ω → LED (y=101) -->
  <line x1="188" y1="101" x2="265" y2="101" stroke="#ff8a65" stroke-width="2"/>
  <rect x="265" y="94" width="40" height="14" rx="3" fill="#fff9c4" stroke="#795548" stroke-width="1.5"/>
  <text x="285" y="104" text-anchor="middle" font-family="monospace" font-size="9" fill="#3e2723">220&#937;</text>
  <line x1="305" y1="101" x2="480" y2="101" stroke="#ff8a65" stroke-width="2"/>

  <!-- Green GPIO22 → 220Ω → LED (y=141) -->
  <line x1="188" y1="141" x2="265" y2="141" stroke="#aed581" stroke-width="2"/>
  <rect x="265" y="134" width="40" height="14" rx="3" fill="#fff9c4" stroke="#795548" stroke-width="1.5"/>
  <text x="285" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#3e2723">220&#937;</text>
  <line x1="305" y1="141" x2="480" y2="141" stroke="#aed581" stroke-width="2"/>

  <!-- Blue  GPIO23 → 220Ω → LED (y=181) -->
  <line x1="188" y1="181" x2="265" y2="181" stroke="#64b5f6" stroke-width="2"/>
  <rect x="265" y="174" width="40" height="14" rx="3" fill="#fff9c4" stroke="#795548" stroke-width="1.5"/>
  <text x="285" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#3e2723">220&#937;</text>
  <line x1="305" y1="181" x2="480" y2="181" stroke="#64b5f6" stroke-width="2"/>

  <!-- ══════════════ RGB LED ══════════════ -->
  <!-- title above box -->
  <text x="570" y="78" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#333">RGB LED</text>
  <text x="570" y="91" text-anchor="middle" font-family="monospace" font-size="9" fill="#ef5350">+ common anode</text>

  <!-- box: left edge x=480, y=95 to y=195 -->
  <rect x="480" y="95" width="175" height="106" rx="8" fill="#f8f8f8" stroke="#616161" stroke-width="2"/>

  <!-- anode wire at top, x=535 -->
  <!-- (already drawn from power rail above) -->
  <!-- small + marker -->
  <text x="541" y="109" font-family="monospace" font-size="10" font-weight="bold" fill="#ef5350">+</text>
  <line x1="535" y1="95" x2="535" y2="88" stroke="#ef5350" stroke-width="2"/>

  <!-- Red cathode row at y=101 — text baseline y=105 -->
  <circle cx="497" cy="101" r="7" fill="#e53935" opacity="0.9"/>
  <text x="510" y="105" font-family="monospace" font-size="11" fill="#333"> Red  (cathode)</text>

  <!-- Green cathode row at y=141 -->
  <circle cx="497" cy="141" r="7" fill="#43a047" opacity="0.9"/>
  <text x="510" y="145" font-family="monospace" font-size="11" fill="#333"> Grn  (cathode)</text>

  <!-- Blue cathode row at y=181 -->
  <circle cx="497" cy="181" r="7" fill="#1e88e5" opacity="0.9"/>
  <text x="510" y="185" font-family="monospace" font-size="11" fill="#333"> Blu  (cathode)</text>

  <!-- ══════════════ Reset button ══════════════ -->
  <text x="395" y="214" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#555">Reset Button</text>
  <text x="395" y="270" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">(internal pull-up enabled)</text>

  <!-- GPIO0 wire → button left -->
  <line x1="188" y1="226" x2="362" y2="226" stroke="#90caf9" stroke-width="2"/>

  <!-- Button symbol: two contacts with gap -->
  <circle cx="366" cy="226" r="3" fill="#555"/>
  <line x1="366" y1="226" x2="374" y2="218" stroke="#555" stroke-width="1.5"/>
  <circle cx="390" cy="226" r="3" fill="#555"/>
  <!-- Button body outline -->
  <rect x="356" y="216" width="44" height="22" rx="4" fill="none" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="378" y="212" text-anchor="middle" font-family="monospace" font-size="8" fill="#777">SW</text>

  <!-- Button right → GND corner -->
  <line x1="390" y1="226" x2="450" y2="226" stroke="#757575" stroke-width="2"/>
  <line x1="450" y1="226" x2="450" y2="254" stroke="#757575" stroke-width="2"/>

  <!-- GND rail -->
  <line x1="188" y1="254" x2="450" y2="254" stroke="#757575" stroke-width="2"/>

  <!-- GND symbol at end -->
  <line x1="450" y1="254" x2="450" y2="260" stroke="#555" stroke-width="2"/>
  <line x1="443" y1="260" x2="457" y2="260" stroke="#555" stroke-width="2"/>
  <line x1="445" y1="264" x2="455" y2="264" stroke="#555" stroke-width="1.5"/>
  <line x1="447" y1="268" x2="453" y2="268" stroke="#555" stroke-width="1"/>

</svg>

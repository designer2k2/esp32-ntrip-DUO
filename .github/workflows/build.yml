name: Build

on:
  push:
    branches: [master]
    paths:
      - 'main/**'
      - 'button/**'
      - 'www/**'
      - 'partitions.csv'
      - 'CMakeLists.txt'
      - 'sdkconfig'
  pull_request:
    branches: [master]
    paths:
      - 'main/**'
      - 'button/**'
      - 'www/**'
      - 'partitions.csv'
      - 'CMakeLists.txt'
      - 'sdkconfig'

jobs:
  build:
    name: Build firmware (ESP-IDF v5.4.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32
          # merge-bin output is a bare filename so esptool (which runs from
          # build/) writes it as build/ESP32-NTRIP-DUO-flash.bin
          command: idf.py build && idf.py merge-bin -o ESP32-NTRIP-DUO-flash.bin

      - name: Collect firmware artifacts
        run: |
          mkdir -p artifacts
          cp build/esp32-xbee.bin           artifacts/ESP32-NTRIP-DUO-ota.bin
          cp build/ESP32-NTRIP-DUO-flash.bin artifacts/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: artifacts/
          retention-days: 30

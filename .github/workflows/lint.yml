name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Super Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # required for changed-files detection on PRs

      - name: Run Super Linter
        uses: super-linter/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: master
          # Only lint files changed in the PR/push (not the whole repo every time)
          VALIDATE_ALL_CODEBASE: false

          # Whitelist mode: only linters set to true run; all others are ignored.
          # Do NOT mix true and false entries — Super Linter forbids it.
          VALIDATE_YAML: true        # GitHub Actions workflow files
          VALIDATE_MARKDOWN: true    # README.md, CLAUDE.md

name: Release

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Build and attach firmware to release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to upload release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32
          command: idf.py build && idf.py merge-bin -o ESP32-NTRIP-DUO-flash.bin

      - name: Collect firmware artifacts
        run: |
          mkdir -p artifacts
          cp build/esp32-xbee.bin            artifacts/ESP32-NTRIP-DUO-ota.bin
          cp build/ESP32-NTRIP-DUO-flash.bin artifacts/

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/ESP32-NTRIP-DUO-ota.bin
            artifacts/ESP32-NTRIP-DUO-flash.bin
